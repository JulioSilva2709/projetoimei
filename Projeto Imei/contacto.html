<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CheckPoint - Contacto</title>
        <link rel="icon" href="imagens/logo.png">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <script src="js/bootstrap.bundle.min.js"></script>
    </head>
    <body>

    <header>
        <img src="imagens/logo.png" alt="chechpoint_logotype">
        <h1>CheckPoint</h1>
    </header>

    <nav>
        <div class="nav-links">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="sobre.html">Sobre nós</a>
            <a class="activebar" href="contacto.html">Contato</a>
        </div>
        <a class="login" href="login.html">Log in</a>
    </nav>

    <main class="container py-5">

        <section>
            <h1>Fale conosco</h1>

            <p>
                Tem alguma dúvida, sugestão ou problema?
                Envia-nos uma mensagem através do formulário abaixo.
            </p>

            <form>

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" placeholder="Seu nome">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Seu email">
                </div>

                <div class="mb-3">
                    <label for="assunto" class="form-label">Assunto</label>
                    <input type="text" class="form-control" id="assunto" placeholder="Assunto da mensagem">
                </div>

                <div class="mb-3">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea class="form-control" id="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Enviar mensagem
                </button>

            </form>
        </section>

    </main>

    <footer>
        <a href="http://store.steampowered.com/" target="_blank">Loja baseada na Steam</a>
        <p>© 2026 CheckPoint</p>
    </footer>

    </body>
</html>
