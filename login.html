<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CheckPoint - Login</title>
        <link rel="icon" href="imagens/logo.png">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <script src="js/bootstrap.bundle.min.js"></script>
    </head>
    <body>

        <header>
            <img src="imagens/logo.png" alt="Checkpoint Logotype">
            <h1>Entrar</h1>
        </header>

    <nav>
        <div class="nav-links">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="sobre.html">Sobre nós</a>
            <a href="contacto.html">Contato</a>
        </div>
        <a class="login activebar" href="login.html">Log in</a>
    </nav>

    <main class="login-page">

        <div class="login-box">

            <h2>Entrar na conta</h2>

            <form>

                <div class="mb-3">
                    <label for="utilizador" class="form-label">
                        Email ou nome de usuário
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="utilizador"
                        placeholder="Email ou nome de usuário">
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Senha">
                </div>

                <div class="forgot-password">
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-4">
                    Entrar
                </button>

            </form>

            <div class="login-divider">
                <span>ou continuar com</span>
            </div>

            <div class="social-login">

                <button class="btn btn-outline-secondary">
                    Google
                </button>

                <button class="btn btn-outline-secondary">
                    Apple
                </button>

                <button class="btn btn-outline-secondary">
                    Steam
                </button>

                <button class="btn btn-outline-secondary">
                    Discord
                </button>

            </div>

            <div class="create-account">
                <p>
                    Não tem conta?
                    <a href="#">Cria agora</a>
                </p>
            </div>

        </div>

    </main>

    <div>

    </div>

    <footer>
        <a href="http://store.steampowered.com/" target="_blank">Loja baseada na Steam</a>
        <p>© 2026 CheckPoint</p>
    </footer>

    </body>
</html>
